; 浦东机场航班牌 —— ESP32-C3 Super Mini + UsartGPU 串口屏 (横屏 320x240)
; 接线: 屏 RX <- GPIO21, 屏 TX -> GPIO20, 5V 供电。屏幕 38400 8N1。
;   env:flightboard  航班牌固件 (USB 推送 + WiFi 自取)
;   env:uartbridge   USB <-> 串口屏透传, 调试屏幕命令用

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.f_flash = 40000000L
board_build.flash_mode = dio
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

[env:flightboard]
build_src_filter = +<flightboard/>
; 串口屏版也带航司标志(本地 tools/make_scr_logos.py 生成), 默认分区放不下, 和彩屏版一样用大分区
board_build.partitions = huge_app.csv
lib_deps =
    bblanchon/ArduinoJson@^7.2.0

; 同一套航班牌, 屏换成 SPI 直驱的 2.4 寸 ST7789 (拆机屏 + 转接板, 没有触摸)
; 接线: SCL=GPIO2 SDA=GPIO3 DC=GPIO4 RES=GPIO5 CS=GPIO7, 3.3V
[env:flightboard_tft]
build_src_filter = +<flightboard/>
build_flags = ${env.build_flags} -DDISPLAY_TFT
board_build.partitions = huge_app.csv
lib_deps =
    bblanchon/ArduinoJson@^7.2.0

[env:uartbridge]
build_src_filter = +<uartbridge/>
